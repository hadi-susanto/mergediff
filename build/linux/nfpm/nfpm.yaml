# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

#
# The release workflow sets GOARCH, VERSION_DATE (YYYY-MM-DD from the tag) and
# GIT_COMMITTER_NAME/GIT_COMMITTER_EMAIL (author of the tagged commit). The
# package version is the date plus the release, e.g. 2026-11-23-1.

name: "mergediff"
arch: ${GOARCH}
platform: "linux"
version: ${VERSION_DATE}
version_schema: none
section: "devel"
priority: "optional"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: |-
  3-way merge and 2-way diff tool
  A lightweight merge and diff GUI inspired by the JetBrains merge tool that
  works as a Git mergetool and difftool.
vendor: "Hadi Susanto Lesmana"
homepage: "https://github.com/hadi-susanto/mergediff"
license: "MIT"
release: "1"

contents:
  - src: "./bin/mergediff"
    dst: "/usr/bin/mergediff"
    file_info:
      mode: 0755
  - src: "./build/appicon.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/mergediff.svg"
    file_info:
      mode: 0644
  - src: "./build/linux/nfpm/mergediff.desktop"
    dst: "/usr/share/applications/mergediff.desktop"
    file_info:
      mode: 0644
  - src: "./LICENSE"
    dst: "/usr/share/doc/mergediff/copyright"
    file_info:
      mode: 0644

# The binary's runtime libraries: GTK 4 + WebKitGTK 6.0 (Ubuntu 24.04+ / Debian 13+).
# Keep in sync with the libraries the binary links (readelf -d bin/mergediff).
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
