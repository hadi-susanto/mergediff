<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>mergediff</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34405a"/>
      <stop offset="1" stop-color="#1c2230"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#background)"/>

  <!-- Panes: Local | Result | Remote -->
  <rect x="12" y="18" width="26" height="92" rx="5" fill="#eef1f6"/>
  <rect x="50" y="18" width="28" height="92" rx="5" fill="#ffffff"/>
  <rect x="90" y="18" width="26" height="92" rx="5" fill="#eef1f6"/>

  <!-- Unchanged lines -->
  <g fill="#b9c1cf">
    <rect x="16" y="25" width="18" height="4" rx="2"/>
    <rect x="16" y="64" width="14" height="4" rx="2"/>
    <rect x="16" y="74" width="18" height="4" rx="2"/>
    <rect x="16" y="84" width="12" height="4" rx="2"/>
    <rect x="16" y="94" width="16" height="4" rx="2"/>

    <rect x="54" y="25" width="20" height="4" rx="2"/>
    <rect x="54" y="35" width="14" height="4" rx="2"/>
    <rect x="54" y="84" width="18" height="4" rx="2"/>
    <rect x="54" y="94" width="12" height="4" rx="2"/>

    <rect x="94" y="25" width="18" height="4" rx="2"/>
    <rect x="94" y="35" width="12" height="4" rx="2"/>
    <rect x="94" y="45" width="16" height="4" rx="2"/>
    <rect x="94" y="94" width="14" height="4" rx="2"/>
  </g>

  <!-- Connectors from each side into the result -->
  <path d="M38 36 C44 36 44 46 50 46 L50 62 C44 62 44 56 38 56 Z" fill="#6aa7ff" fill-opacity="0.85"/>
  <path d="M90 66 C84 66 84 62 78 62 L78 78 C84 78 84 86 90 86 Z" fill="#ffb957" fill-opacity="0.85"/>

  <!-- Changed chunks: Local (blue), Remote (orange), merged Result (blue + orange) -->
  <rect x="12" y="36" width="26" height="20" fill="#3d8bfd"/>
  <rect x="90" y="66" width="26" height="20" fill="#ff9f1c"/>
  <rect x="50" y="46" width="28" height="16" fill="#3d8bfd"/>
  <rect x="50" y="62" width="28" height="16" fill="#ff9f1c"/>

  <!-- Lines inside the changed chunks -->
  <g fill="#ffffff">
    <rect x="16" y="40" width="18" height="4" rx="2"/>
    <rect x="16" y="48" width="12" height="4" rx="2"/>
    <rect x="94" y="70" width="16" height="4" rx="2"/>
    <rect x="94" y="78" width="12" height="4" rx="2"/>
    <rect x="54" y="52" width="18" height="4" rx="2"/>
    <rect x="54" y="68" width="14" height="4" rx="2"/>
  </g>
</svg>
