<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>mergediff</title>
    <script>
        // Apply the theme before the first paint (see themeFromURL in theme.ts):
        // the window URL carries the "theme" setting, e.g. /?theme=dark.
        (function () {
            var s = new URLSearchParams(location.search).get("theme");
            var dark = s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.dataset.theme = dark ? "dark" : "light";
            document.documentElement.style.colorScheme = dark ? "dark" : "light";
        })();
    </script>
    <style>
        /* Until styles.css loads; the same colours as its --chrome-bg. */
        html { background: #f4f3ef; }
        html[data-theme="dark"] { background: #262624; }
    </style>
</head>
<body>
<div class="app">
    <header class="toolbar" id="toolbar">
        <div class="toolbar-left" id="toolbar-left"></div>
        <div class="toolbar-right" id="toolbar-right"></div>
    </header>
    <main class="panes" id="panes"></main>
    <footer class="statusbar">
        <span id="status-left" role="status"></span>
        <span id="status-right"></span>
    </footer>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
